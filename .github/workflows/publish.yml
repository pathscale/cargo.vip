name: publish

concurrency:
  group: cargo-vip-version-tag
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Full SHA of the reviewed master dispatch commit
        type: string
        required: true
      mode:
        description: Retain verified evidence or publish to crates.io
        type: choice
        options: [verify, publish]
        default: verify
        required: true
      evidence_run_id:
        description: Original publisher run ID for recovery, or blank to run the gate
        type: string

permissions:
  contents: read

env:
  RUST_VERSION: '1.94.1'
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  guard:
    runs-on: ubicloud-standard-2
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Bind review to the dispatch commit before checkout
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        run: |
          set -euo pipefail
          [[ $GITHUB_EVENT_NAME == workflow_dispatch && $GITHUB_REF == refs/heads/master &&
             $REVIEWED_SHA =~ ^[0-9a-f]{40}$ && $REVIEWED_SHA == "$GITHUB_SHA" ]]

  verify:
    needs: guard
    if: inputs.evidence_run_id == ''
    runs-on: ubicloud-standard-2
    timeout-minutes: 30
    env:
      REVIEWED_SHA: ${{ inputs.reviewed_sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install reviewed Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
          echo "RUSTUP_TOOLCHAIN=$RUST_VERSION" >> "$GITHUB_ENV"
      - name: Run gates and retain exact crate and lock evidence
        run: bash .github/release/crate.sh verify "$RUNNER_TEMP/crate-evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crate-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/crate-evidence/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [guard, verify]
    if: >-
      ${{ !cancelled() && needs.guard.result == 'success' && inputs.mode == 'publish' &&
          (needs.verify.result == 'success' || (needs.verify.result == 'skipped' && inputs.evidence_run_id != '')) }}
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    environment: release
    permissions:
      actions: read
      contents: write
    env:
      REVIEWED_SHA: ${{ inputs.reviewed_sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the publisher evidence run
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_RUN: ${{ inputs.evidence_run_id }}
        run: |
          set -euo pipefail
          source .github/release/common.sh
          assert_reviewed
          verify_workflow_run "${EVIDENCE_RUN:-$GITHUB_RUN_ID}" publish
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: crate-evidence-${{ github.sha }}
          github-token: ${{ github.token }}
          run-id: ${{ steps.evidence.outputs.run_id }}
          path: ${{ runner.temp }}/crate-evidence
      - name: Verify version-tag protection
        env:
          GH_TOKEN: ${{ secrets.RELEASE_RULESET_TOKEN }}
        run: |
          set -euo pipefail
          source .github/release/common.sh
          assert_reviewed
          require_tag_protection
      - name: Preflight and reserve the evidence-bound tag
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_RUN: ${{ steps.evidence.outputs.run_id }}
          REGISTRY_TOKEN_PRESENT: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
        run: bash .github/release/crate.sh prepare "$RUNNER_TEMP/crate-evidence" "$EVIDENCE_RUN"
      - name: Upload the verified bytes to crates.io
        if: steps.prepare.outputs.upload == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_RUN: ${{ steps.evidence.outputs.run_id }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash .github/release/crate.sh upload "$RUNNER_TEMP/crate-evidence" "$EVIDENCE_RUN"
      - name: Confirm the public crate checksum
        env:
          EVIDENCE_RUN: ${{ steps.evidence.outputs.run_id }}
        run: bash .github/release/crate.sh confirm "$RUNNER_TEMP/crate-evidence" "$EVIDENCE_RUN"
