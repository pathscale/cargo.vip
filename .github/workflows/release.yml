name: release

concurrency:
  group: cargo-vip-version-tag
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Full SHA of the reviewed master dispatch commit
        type: string
        required: true
      evidence_run_id:
        description: Publisher evidence run ID for this SHA
        type: string
        required: true
      build_run_id:
        description: Earlier binary build run ID for this SHA, or blank to build
        type: string
      force:
        description: Replace conflicting assets on the already matching tag
        type: boolean
        default: false

permissions:
  contents: read

env:
  RUST_VERSION: '1.94.1'
  CARGO_TERM_COLOR: always

jobs:
  guard:
    runs-on: ubicloud-standard-2
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Bind review to the dispatch commit before checkout
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        run: |
          set -euo pipefail
          [[ $GITHUB_EVENT_NAME == workflow_dispatch && $GITHUB_REF == refs/heads/master &&
             $REVIEWED_SHA =~ ^[0-9a-f]{40}$ && $REVIEWED_SHA == "$GITHUB_SHA" ]]

  evidence:
    needs: guard
    runs-on: ubicloud-standard-2
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    env:
      REVIEWED_SHA: ${{ inputs.reviewed_sha }}
    outputs:
      gate_run: ${{ steps.gate.outputs.run_id }}
      build_run: ${{ steps.build.outputs.run_id }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify publisher evidence run
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_RUN: ${{ inputs.evidence_run_id }}
        run: |
          set -euo pipefail
          source .github/release/common.sh
          assert_reviewed
          verify_workflow_run "$EVIDENCE_RUN" publish
      - name: Verify binary build run
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          source .github/release/common.sh
          assert_reviewed
          verify_workflow_run "${BUILD_RUN:-$GITHUB_RUN_ID}" release

  build:
    needs: evidence
    if: inputs.build_run_id == ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    env:
      REVIEWED_SHA: ${{ inputs.reviewed_sha }}
      EVIDENCE_RUN: ${{ needs.evidence.outputs.gate_run }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-unknown-linux-musl
            runner: ubicloud-standard-2
          - target: x86_64-unknown-linux-musl
            runner: ubicloud-standard-2
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify reviewed checkout
        run: |
          set -euo pipefail
          source .github/release/common.sh
          assert_reviewed
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: crate-evidence-${{ github.sha }}
          github-token: ${{ github.token }}
          run-id: ${{ needs.evidence.outputs.gate_run }}
          path: ${{ runner.temp }}/crate-evidence
      - name: Install reviewed Rust toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target "$TARGET"
          echo "RUSTUP_TOOLCHAIN=$RUST_VERSION" >> "$GITHUB_ENV"
      - name: Build from the retained lock and package target evidence
        env:
          TARGET: ${{ matrix.target }}
        run: bash .github/release/binary.sh build "$TARGET" "$RUNNER_TEMP/crate-evidence" "$RUNNER_TEMP/binary-evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binary-${{ github.sha }}-${{ matrix.target }}
          path: ${{ runner.temp }}/binary-evidence/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [evidence, build]
    if: >-
      ${{ !cancelled() && needs.evidence.result == 'success' &&
          (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.build_run_id != '')) }}
    runs-on: ubicloud-standard-2
    timeout-minutes: 20
    environment: release
    permissions:
      actions: read
      contents: write
    env:
      REVIEWED_SHA: ${{ inputs.reviewed_sha }}
      EVIDENCE_RUN: ${{ needs.evidence.outputs.gate_run }}
      BUILD_RUN: ${{ needs.evidence.outputs.build_run }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify reviewed checkout
        run: |
          set -euo pipefail
          source .github/release/common.sh
          assert_reviewed
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: crate-evidence-${{ github.sha }}
          github-token: ${{ github.token }}
          run-id: ${{ needs.evidence.outputs.gate_run }}
          path: ${{ runner.temp }}/crate-evidence
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: binary-${{ github.sha }}-*
          github-token: ${{ github.token }}
          run-id: ${{ needs.evidence.outputs.build_run }}
          path: ${{ runner.temp }}/binaries
      - name: Verify version-tag protection
        env:
          GH_TOKEN: ${{ secrets.RELEASE_RULESET_TOKEN }}
        run: |
          set -euo pipefail
          source .github/release/common.sh
          assert_reviewed
          require_tag_protection
      - name: Verify all target evidence and reconcile the exact release
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: bash .github/release/binary.sh release "$RUNNER_TEMP/crate-evidence" "$RUNNER_TEMP/binaries"
