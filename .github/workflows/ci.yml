name: ci

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets
      - run: cargo test

      # The point of this tool is to avoid OpenSSL and a system trust store.
      # A transitive dependency turning one on would be silent otherwise.
      - name: No OpenSSL, no native trust store
        run: |
          set -euo pipefail
          if grep -E '^name = "(openssl|openssl-sys|native-tls|rustls-native-certs|openssl-probe)"' Cargo.lock; then
            echo "::error::an OpenSSL or system-trust-store crate entered the graph" >&2
            exit 1
          fi
